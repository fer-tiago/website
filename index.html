---
layout: default
title: "Tiago Ferreira"
---
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<style>
body {
    margin: 0;
    overflow-y: hidden;
    overflow-x: auto;
}
</style>

<div id="intro-overlay">
    <div id="intro-message">
        Click to enter
    </div>
    <label id="music-label">       
        Music?
        <input type="checkbox" id="music-checkbox" checked>
    </label>
</div>

<div class="gallery-grid" id="gallery">

{% assign posts = site.posts | sort: "date" | reverse %}

{% for post in posts %}
    <a
        class="image-slice"
        href="{{ post.url | relative_url }}"
        data-tags="{{ post.tags | join: ',' }}"
    >
        <img
            src="{{ post.cover_image }}"
            alt="{{ post.title }}"
        >
    </a>
{% endfor %}

</div>

<script>

// ----------------------------------------
// MUSIC
// ----------------------------------------

const tracks = [

{% for track in site.music %}
{
    title: {{ track.title | jsonify }},
    artist: {{ track.artist | jsonify }},
    file: {{ track.file | relative_url | jsonify }}
},
{% endfor %}

];

let player;
let currentTrack;

// Helper to detect page refresh
function isPageRefresh() {
    if (performance.navigation) {
        return performance.navigation.type === 1;
    }
    if (performance.getEntriesByType) {
        const navEntries = performance.getEntriesByType('navigation');
        return navEntries.length > 0 && navEntries[0].type === 'reload';
    }
    return false;
}

// Get or pick track
const savedTrackIndex = sessionStorage.getItem('currentTrackIndex');

if (savedTrackIndex !== null && !isPageRefresh()) {
    // Navigating within site — keep same track
    currentTrack = tracks[savedTrackIndex];
} else {
    // First visit or refresh — pick random
    const randomIndex = Math.floor(Math.random() * tracks.length);
    currentTrack = tracks[randomIndex];
    sessionStorage.setItem('currentTrackIndex', randomIndex);
}

// Create or reuse player
if (window.archivePlayer && window.archiveTrack && window.archiveTrack.file === currentTrack.file) {
    player = window.archivePlayer;
} else {
    player = new Audio(currentTrack.file);
    player.loop = true;

    const savedVolume = localStorage.getItem('archiveVolume');
    if (savedVolume !== null) {
        player.volume = parseFloat(savedVolume);
    } else {
        player.volume = 0.2;
    }

    window.archivePlayer = player;
}

window.archiveTrack = currentTrack;

// ----------------------------------------
// MULTI-TAG FILTERING & TOGGLES (CLEAN URL)
// ----------------------------------------

// 1. Define your exclusive tags here (lowercase)
const exclusiveTags = ['photography', 'hidden']; 

// Silently load active tags from background memory instead of the URL
const savedTags = sessionStorage.getItem('archiveActiveTags');
let activeTags = savedTags ? JSON.parse(savedTags) : [];

// 2. Helper function to apply the display changes to the DOM
function renderGalleryChanges() {
    document.querySelectorAll('.image-slice').forEach(post => {
        const postTags = (post.dataset.tags || '')
            .split(',')
            .map(t => t.trim().toLowerCase());

        const isExclusivePost = postTags.some(tag => exclusiveTags.includes(tag));

        if (activeTags.length === 0) {
            // NO TAGS SELECTED: Show all UNLESS it's an exclusive post
            post.style.display = isExclusivePost ? 'none' : '';
            return;
        }

        // TAGS ARE SELECTED: Show post if it matches any active tag
        const isMatch = activeTags.some(tag => postTags.includes(tag));
        post.style.display = isMatch ? '' : 'none';
    });

    // Update the visual states of the links
    const body = document.body;
    if (activeTags.length > 0) {
        body.classList.add('tags-active');
    } else {
        body.classList.remove('tags-active');
    }

    document.querySelectorAll('a[href^="?tag="]').forEach(link => {
        const linkTag = link.getAttribute('href').replace('?tag=', '').toLowerCase();
        if (activeTags.includes(linkTag)) {
            link.classList.add('active-tag');
        } else {
            link.classList.remove('active-tag');
        }
    });
}

// 3. Main function to trigger the layout shift (with View Transitions API)
function applyTags() {
    if (document.startViewTransition) {
        document.startViewTransition(() => renderGalleryChanges());
    } else {
        renderGalleryChanges();
    }
}

// Apply on initial page load
applyTags();

// ----------------------------------------
// INTERCEPT TAG LINKS
// ----------------------------------------

document.addEventListener('click', event => {
    const link = event.target.closest('a');
    if (!link) return;

    const href = link.getAttribute('href');
    if (!href || !href.startsWith('?tag=')) return;

    event.preventDefault();

    const clickedTag = href.replace('?tag=', '').toLowerCase();

    // 4. TOGGLE LOGIC
    if (exclusiveTags.includes(clickedTag)) {
        if (activeTags.length === 1 && activeTags[0] === clickedTag) {
            activeTags = [];
        } else {
            activeTags = [clickedTag];
        }
    } else {
        activeTags = activeTags.filter(t => !exclusiveTags.includes(t));

        if (activeTags.includes(clickedTag)) {
            activeTags = activeTags.filter(t => t !== clickedTag);
        } else {
            activeTags.push(clickedTag);
        }
    }

    // 5. Save state silently in the background (No URL changes!)
    sessionStorage.setItem('archiveActiveTags', JSON.stringify(activeTags));

    // Run the animation and filter
    applyTags();
});
    
// ----------------------------------------
// TEXT SLICES DATA
// ----------------------------------------

const textSlices = [

   {
    isPlayer: true,

    trackText:
        currentTrack.title +
        ' — ' +
        currentTrack.artist,

    side: 'left'
   },

    {% for slice in site.slices %}
    {
        text1: {{ slice.text_1 | default: "" | jsonify }},
        link1: {{ slice.link_1 | default: "" | jsonify }},

        text2: {{ slice.text_2 | default: "" | jsonify }},
        link2: {{ slice.link_2 | default: "" | jsonify }},

        text3: {{ slice.text_3 | default: "" | jsonify }},
        link3: {{ slice.link_3 | default: "" | jsonify }},

        text4: {{ slice.text_4 | default: "" | jsonify }},
        link4: {{ slice.link_4 | default: "" | jsonify }},

        side: {{ slice.side | default: "right" | jsonify }}
    },
    {% endfor %}

];

// ----------------------------------------
// TEXT SLICE HELPERS
// ----------------------------------------

const gallery =
    document.getElementById('gallery');

const occupiedPositions =
    new Set();

function createSection(text, link = '') {

    if (!text) return '';

    return `
        <div class="text-slice-section">
            ${
                link
                    ? `<a href="${link}" class="text-slice-link">${text}</a>`
                    : text
            }
        </div>
    `;
}

function createTextSlice(data) {

    const element = document.createElement('div');
    element.className = `text-slice ${data.side || 'right'}`;

    if (data.isPlayer) {
        // Original 3-part music player
        element.innerHTML = `
            <div class="text-slice-section">
            now playing
            </div>

            <div class="text-slice-section">
            ${data.trackText}
            </div>

            <div class="text-slice-section music-controls">
                <button class="music-button" id="playPauseButton">PAUSE</button>

                <input
                    type="range"
                    min="0"
                    max="100"
                    value="100"
                    class="volume-slider"
                    id="volumeSlider"
                >
            </div>
        `;
    } else {
        // 4-part text slices
        element.innerHTML =
            createSection(data.text1, data.link1) +
            createSection(data.text2, data.link2) +
            createSection(data.text3, data.link3) +
            createSection(data.text4, data.link4);
    }

    return element;
}

function randomPosition() {
    //Determine the maximum slots based on screen width
    const maxLimit = window.innerWidth < 800 ? 4 : 10;
    
    const max = Math.min(maxLimit, gallery.children.length);

    let position;
    do {
        position = Math.floor(Math.random() * max) + 1;
    } while (
        occupiedPositions.has(position) &&
        occupiedPositions.size < max
    );

    occupiedPositions.add(position);
    return position;
}

function insertSlice(element) {

    const position =
        randomPosition();

    if (gallery.children[position]) {

        gallery.insertBefore(
            element,
            gallery.children[position]
        );

    } else {

        gallery.appendChild(element);

    }

}

// ----------------------------------------
// BUILD SLICES
// ----------------------------------------

textSlices
    .map(createTextSlice)
    .forEach(insertSlice);



// ----------------------------------------
// PLAYER CONTROLS
// ----------------------------------------

const volumeSlider =
    document.getElementById(
        'volumeSlider'
    );



if (volumeSlider) {

    volumeSlider.value =
        player.volume * 100;

    volumeSlider.addEventListener(
        'input',
        () => {

            player.volume =
                volumeSlider.value / 100;

            localStorage.setItem(
                'archiveVolume',
                player.volume
            );

        }
    );

}

const playPauseButton =
    document.getElementById('playPauseButton');

function updatePlayPauseButton() {
    playPauseButton.innerHTML = player.paused
        ? `
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
            >
                <polygon points="6,3 20,12 6,21" />
            </svg>
        `
        : `
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
            >
                <rect x="5" y="3" width="5" height="18" />
                <rect x="14" y="3" width="5" height="18" />
            </svg>
        `;
}

if (playPauseButton) {

    updatePlayPauseButton();

    playPauseButton.addEventListener('click', async () => {

        if (player.paused) {
            await player.play();
        } else {
            player.pause();
        }

        updatePlayPauseButton();

    });

    player.addEventListener('play', updatePlayPauseButton);
    player.addEventListener('pause', updatePlayPauseButton);
}
    


// ----------------------------------------
// MUSIC CHECKBOX (play if checked)
// ----------------------------------------

const musicCheckbox = document.getElementById('music-checkbox');
const musicLabel = document.getElementById('music-label');

let musicOn = localStorage.getItem('archiveMusicOn');
if (musicOn === null) {
    musicOn = true;             
} else {
    musicOn = (musicOn === 'true');
}

if (musicCheckbox) {
    musicCheckbox.checked = musicOn;

    musicCheckbox.addEventListener('change', () => {
        musicOn = musicCheckbox.checked;
        localStorage.setItem('archiveMusicOn', musicOn);
    });
}

if (musicLabel) {
    musicLabel.addEventListener('click', (e) => {
        e.stopPropagation();
    });
}

async function startMusicIfAllowed() {
    if (musicOn) {
        try {
            await player.play();
        } catch (err) {
            console.log(err);
        }
    }
}

// ----------------------------------------
// INTRO OVERLAY
// ----------------------------------------

const overlay = document.getElementById('intro-overlay');
const hasEntered = sessionStorage.getItem('archiveEntered');

function enableHorizontalScroll() {
    gallery.addEventListener(
        'wheel',
        (event) => {
            event.preventDefault();
            gallery.scrollLeft += event.deltaY;
        },
        { passive: false }
    );
}

async function enterArchive() {
    sessionStorage.setItem('archiveEntered', 'true');

    await startMusicIfAllowed(); 

    enableHorizontalScroll();

    overlay.classList.add('hidden');

    setTimeout(() => {
        overlay.remove();
    }, 1200);
}

if (hasEntered) {
    if (overlay) overlay.remove();
    enableHorizontalScroll();
    startMusicIfAllowed();
} else {
    overlay.addEventListener('click', enterArchive);
}

window.addEventListener('pageshow', () => {
    if (sessionStorage.getItem('archiveEntered')) {
        if (overlay) overlay.remove();
        enableHorizontalScroll();
        startMusicIfAllowed();
    }
});

// ----------------------------------------
// IMAGE FADE-IN ON LOAD
// ----------------------------------------

document.addEventListener("DOMContentLoaded", () => {
    const galleryImages = document.querySelectorAll('.gallery-grid img');
    
    galleryImages.forEach(img => {
        // If the image is already cached by the browser, it might load instantly.
        // We check img.complete to ensure cached images still get the class.
        if (img.complete) {
            img.classList.add('loaded');
        } else {
            // Otherwise, wait for the actual load event
            img.addEventListener('load', () => {
                img.classList.add('loaded');
            });
        }
    });
});

</script>
