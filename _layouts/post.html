---
layout: downscroll
title: "Tiago Ferreira"
---

<article class="post">
    
<button
    class="back-button"
    onclick="goBack()"
>
    ← back
</button>
    
    <p class="post-title">
        {{ page.title }}
    </p>

    <p class="post-date">
        {{ page.date | date: "%d.%m.%Y" }}
    </p>

    {% if page.cover_image %}
    <p class="post-image">
        <img
            src="{{ page.cover_image }}"
            alt="{{ post.title | escape }}"
        >
    </p>
    {% endif %}

    <div class="post-body">
        {{ content }}
    </div>
    


<script>
function goBack() {
    var internal = document.referrer &&
        new URL(document.referrer).origin === location.origin;

    if (internal && history.length > 1) {
        history.back();
    } else {
        window.location.href = '{{ "/" | relative_url }}';
    }
}
</script>
</article>
