media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: Visual Archive
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{slug}.md"

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true

      - name: tags
        label: Tags
        type: string
        list: true

      - name: cover_image
        label: Cover Image URL
        type: string
        required: true

      - name: body
        label: Content
        type: rich-text

  - name: slices
    label: Text Slices
    type: collection
    path: _slices

    fields:
      - name: text_1
        label: Text 1 (Top)
        type: string
      
      - name: link_1
        label: Link 1
        type: string
        required: false
      
      - name: text_2
        label: Text 2 (Upper Middle)
        type: string
      
      - name: link_2
        label: Link 2
        type: string
        required: false
      
      - name: text_3
        label: Text 3 (Lower Middle)
        type: string
      
      - name: link_3
        label: Link 3
        type: string
        required: false
      
      - name: text_4
        label: Text 4 (Bottom)
        type: string
      
      - name: link_4
        label: Link 4
        type: string
        required: false
      
      - name: side
        label: Side
        type: string
        default: left

  - name: music
    label: Music
    type: collection
    path: _music

    fields:
      - name: title
        label: Track Title
        type: string

      - name: artist
        label: Artist
        type: string

      - name: file
        label: MP3 File
        type: string
