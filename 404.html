<div 
    id="error-404">
    
    <div id="message-404">
        404
    </div>
    <button
    class="back-button"
    onclick="goBack()"
>
    ← back
</button>

    
    <script>
function goBack() {
    var internal = document.referrer &&
        new URL(document.referrer).origin === location.origin;

    if (internal && history.length > 1) {
        history.back();
    } else {
        window.location.href = '{{ "/" | relative_url }}';
    }
}
</script>
    
</div>
